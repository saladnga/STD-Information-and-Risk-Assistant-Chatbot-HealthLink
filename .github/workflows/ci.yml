name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Smoke-test backend imports
        working-directory: backend/app
        env:
          OPENAI_API_KEY: "sk-test-dummy-key-for-ci"
          VITE_SUPABASE_URL: "https://ci-placeholder.supabase.co"
          SUPABASE_SERVICE_KEY: "ci-placeholder-service-key"
          ALLOWED_ORIGINS: "http://localhost:5173"
        run: python -c "import main; print('Backend imports OK')"
